<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#14161a" />
  <title>Evarium — Live World — Early Alpha</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #cfd3da;
                 font: 14px system-ui, sans-serif; overflow: hidden;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* Every floating surface stacks on this scale rather than on a number
       somebody picked in the moment. The panels all share one layer because
       only one of them is ever open (see .panel below). */
    :root { --z-bar: 2; --z-minimap: 3; --z-panel: 5; --z-toast: 10;
            /* How far down a panel starts. Measured from the toolbar itself
               (see syncBarHeight in main.ts) because the toolbar WRAPS: on a
               phone it is two rows, and the 52px every panel used to assume
               was one row's worth, so a panel opened over its own buttons. */
            --bar-h: 52px; }
    #app { position: fixed; inset: 0; }
    /* The vector overlay the WebGL path draws rings/doors/badges onto; it
       tracks #cv exactly and never takes pointer events. */
    #fx { position: absolute; inset: 0; pointer-events: none; }

    /* ---- the panel system ------------------------------------------------
       Every box that floats over the world is one of four things, and they all
       share the chrome below so they cannot drift apart. Only the ANCHOR
       differs:

         .card   a caption on the world — bottom left, sized to its content
         .menu   a drop-down from a toolbar button — top right, sized to fit
         .half   a panel: the right-hand column, half the viewport high
         .full   a panel: everything under the toolbar

       .half and .full are the two sizes a panel swaps between with the ⛶/⊟ in
       its own header. A card and a menu have no sizes to swap: a thing that
       only makes sense small is a caption on the world, not a panel over it,
       and blowing four rows of tile facts up to full screen is how the tile
       inspector used to open.

       The menu and both panel sizes claim the same top-right anchor, so
       opening one closes the others — see claimRightColumn() in main.ts. Two
       open at once was two boxes fighting over one corner, with the winner
       decided by a z-index nobody had chosen on purpose. */
    /* border-box so a declared width is the width on screen: content-box quietly
       added the 12px sides and the border, and the "480px" half column measured
       506. Sizes that do not mean what they say are how two of them drifted
       apart in the first place. */
    .panel { position: fixed; z-index: var(--z-panel); box-sizing: border-box;
             display: none; flex-direction: column; overflow-y: auto;
             -webkit-overflow-scrolling: touch;
             background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
             padding: 0 12px 10px; backdrop-filter: blur(4px); }
    .panel.open { display: flex; }
    .panel.card { left: max(8px, env(safe-area-inset-left));
                  bottom: max(8px, env(safe-area-inset-bottom));
                  width: min(240px, 46vw); }
    .panel.menu { top: var(--bar-h); right: max(8px, env(safe-area-inset-right)); }
    .panel.half { top: var(--bar-h); right: max(8px, env(safe-area-inset-right));
                  width: min(480px, calc(100vw - 16px)); height: 50vh; }
    .panel.full { top: var(--bar-h); right: max(8px, env(safe-area-inset-right));
                  left: max(8px, env(safe-area-inset-left)); bottom: 8px; }
    /* The title stays put while the body scrolls under it. Opaque — not the
       panel's translucent fill — so rows cannot show through as they pass, and
       full-bleed sideways via negative SIDE margins against the panel's own
       side padding.

       It owns the panel's TOP padding rather than reaching back over it with a
       negative top margin. A sticky offset constrains the MARGIN box, so
       `margin-top: -10px` with `top: 0` parks the header ten pixels lower than
       flush the moment it sticks, and the panel's top padding becomes a window
       onto the text scrolling underneath. That looked right at rest and fought
       the element only while doing its job, which is why it shipped twice. */
    .panel > h3 { position: sticky; top: 0; z-index: 2; flex: 0 0 auto;
                  margin: 0 -12px 6px; padding: 10px 12px 6px;
                  background: #1d2026; border-bottom: 1px solid #ffffff14;
                  font: 600 13px system-ui, sans-serif;
                  display: flex; align-items: center; gap: 6px; }
    .panel > h3 .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; }
    /* The size toggle sits hard right, the close after it. They wear DIFFERENT
       classes on purpose: the close wiring takes the first `.x` it finds, and a
       size toggle that closed the panel would be a trap. */
    .panel > h3 .szbtn { margin-left: auto; cursor: pointer; opacity: .55; }
    .panel > h3 .x { margin-left: 8px; cursor: pointer; opacity: .7; }
    .panel > h3 .szbtn:hover, .panel > h3 .x:hover { opacity: 1; }
    .panel > h3:not(:has(.szbtn)) .x { margin-left: auto; }
    #hud { position: fixed; right: 8px; bottom: 8px; z-index: var(--z-panel); display: none;
           font: 11px/1.5 ui-monospace, monospace; color: #cfd6e4;
           background: rgba(10,12,16,0.75); padding: 6px 8px; border-radius: 6px;
           white-space: pre; pointer-events: none; }
    /* The population graph: headcount by trophic role over time. Sits above the
       bar and away from the inspect panel (bottom-left) and minimap. Its canvas
       is drawn at device resolution and CSS-scaled down, so the 1px series lines
       stay sharp on a phone -- unlike the world canvas it is a chart, not art,
       so `pixelated` would be exactly wrong here. */
    /* The chart flexes to whatever size the panel was given and redraws there.
       The window readout already takes the free space, so the size toggle sits
       next to it rather than claiming a second `margin-left: auto` and
       splitting the gap with it. */
    #pop h3 { gap: 10px; }
    #pop h3 .win { margin-left: auto; opacity: .6; font-weight: 400;
                   font-variant-numeric: tabular-nums; }
    #pop h3 .win ~ .szbtn { margin-left: 0; }
    #popCv { width: 100%; flex: 1; min-height: 0; display: block;
             image-rendering: auto; touch-action: auto; }
    /* Wraps: the lineage lens can carry a dozen-plus species where roles have
       four, and a legend that clips is a legend that lies by omission. */
    #popKey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px;
              font: 11px/1.6 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    #pop h3 button { background: none; border: none; color: inherit; font: inherit;
                     padding: 0; cursor: pointer; opacity: .45; }
    #pop h3 button.on { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    /* Two checkboxes hanging off a toolbar button: a menu, sized by what it
       holds. The round swatch is the colour that overlay paints the world. */
    #ovl label { display: flex; align-items: center; gap: 8px; padding: 4px 0;
                 font-size: 12px; cursor: pointer; user-select: none; }
    #ovl .sw { width: 11px; height: 11px; border-radius: 50%; opacity: .85; }
    #tuning .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase;
                   letter-spacing: .06em; opacity: .5;
                   border-top: 1px solid #ffffff14; padding-top: 6px; }
    #tuning .trow { display: flex; align-items: center; gap: 8px; padding: 2px 0;
                    font-size: 11px; }
    #tuning .trow .tname { flex: 0 1 118px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; opacity: .8;
                           font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #tuning .trow input[type=range] { flex: 1 1 auto; min-width: 60px; }
    #tuning .trow input[type=number] { flex: 0 0 78px; background: #14161a;
                                       color: inherit; border: 1px solid #3a3f4a;
                                       border-radius: 5px; padding: 2px 4px;
                                       font: 11px ui-monospace, monospace; }
    #tuning .trow input:disabled { opacity: .45; }
    #tuning .trow .tunit { flex: 0 1 96px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; opacity: .55; font-size: 10px; }
    #tuning .trow .lock { flex: 0 0 12px; opacity: .5; font-size: 10px; }
    #tuning .trow.changed .tname { color: #d6b16a; opacity: 1; }
    #tuning .foot { position: sticky; bottom: -10px; margin: 8px -12px -10px;
                    padding: 8px 12px 10px; background: #1d2026;
                    border-top: 1px solid #ffffff14; display: flex; gap: 8px;
                    align-items: center; }
    #tuning .foot .note { opacity: .55; font-size: 11px; }
    #tuning .foot button { margin-left: auto; }
    #popKey span { display: flex; align-items: center; gap: 5px; cursor: pointer;
                   -webkit-tap-highlight-color: transparent; }
    #popKey span.off { opacity: .4; }
    #popKey i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    /* image-rendering: the world canvas renders at 1x CSS pixels (see resize()
       in main.ts) and the browser upscales it on hiDPI displays — pixelated
       keeps the fat art-pixels crisp instead of smearing them. */
    canvas { display: block; width: 100%; height: 100%; touch-action: none;
             image-rendering: pixelated; }
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px;
           align-items: center; padding: max(6px, env(safe-area-inset-top)) 8px 6px;
           background: linear-gradient(#14161ae0, #14161a00); z-index: var(--z-bar); flex-wrap: wrap; }
    #bar button, #bar select { background: #2a2e36cc; color: #cfd3da; border: 1px solid #3a3f4a;
           border-radius: 6px; padding: 6px 12px; font: inherit; backdrop-filter: blur(3px); }
    #bar button.on { background: #2f6b28; border-color: #3f8f35; }
    #bar button:disabled, #bar select:disabled { opacity: .4; cursor: not-allowed; }
    #stats { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
             transform: translateX(-50%); background: #2a2e36ee; border: 1px solid #3a3f4a;
             border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity .25s;
             pointer-events: none; z-index: var(--z-toast); } /* above every panel */
    /* #inspect is three surfaces sharing one element, and which one it is at
       any moment is the ANCHOR class it wears (see the panel system above):
       the plain entity card and the tile dump are `.card`, the debug creature
       inspector is a `.full`/`.half` panel. It used to wear one class, `.dbg`,
       for all three — so four rows of tile facts opened full screen. */
    #inspect .tabs { display: flex; gap: 2px; margin: 0 0 8px;
                     border-bottom: 1px solid #ffffff14; }
    #inspect .tabs button { background: none; border: none; color: inherit;
                            font: 12px system-ui, sans-serif; padding: 4px 10px;
                            cursor: pointer; opacity: .5; border-bottom: 2px solid transparent; }
    #inspect .tabs button.on { opacity: 1; border-bottom-color: #7aa2f7; }
    #inspect .lin { font-size: 12px; }
    #inspect .lin .node { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
    #inspect .lin .node.link { cursor: pointer; }
    #inspect .lin .node.link:hover { background: #ffffff0a; }
    #inspect .lin .up { opacity: .45; width: 14px; text-align: center; }
    #inspect .lin .who { flex: 1; }
    #inspect .lin .meta { opacity: .6; font-variant-numeric: tabular-nums; }
    #inspect .lin .dead { opacity: .55; }
    #inspect .lin .end { opacity: .5; font-style: italic; padding: 4px 0 2px 21px; }
    #inspect table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #inspect td { padding: 1px 0; }
    #inspect td.k { opacity: .6; }
    #inspect td.v { text-align: right; font-variant-numeric: tabular-nums;
                    word-break: break-word; max-width: 62%; }
    #inspect .mono { opacity: .7; font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #inspect .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase;
                    letter-spacing: .06em; opacity: .5; border-top: 1px solid #ffffff14;
                    padding-top: 6px; }
    #inspect h3 + .grp { border-top: 0; padding-top: 0; margin-top: 2px; }
    #inspect .mindlink { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                         border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    /* The mind TAB of the inspector: the creature's evolvable program, live I/O
       and registers. It was a panel of its own, with its own frame, position
       and close button; as a tab it is only content, and the panel around it
       supplies the rest. Everything below is that content's own styling. */
    #inspect .mind .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                 opacity: .5; border-top: 1px solid #ffffff14; padding-top: 6px; }
    #inspect .mind .mono { font: 11px ui-monospace, Menlo, Consolas, monospace; }
    /* The plain-language "what is it doing" headline, decoded from actuators. */
    #inspect .mind .doing { margin: 2px 0 4px; font-size: 13px; color: #eafbe8; }
    #inspect .mind .doing::before { content: '▶ '; opacity: .55; }
    /* One I/O channel: name · shape-appropriate visual · value. Inert channels
       dim so the live ones read first; a firing actuator gets a lit row. */
    #inspect .mind .ch { display: flex; align-items: center; gap: 8px; padding: 1.5px 0; font-size: 12px; }
    #inspect .mind .ch.dim { opacity: .34; }
    #inspect .mind .ch.fire { background: #2f6b2833; border-radius: 4px; }
    #inspect .mind .ch .nm { width: 33%; opacity: .72; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #inspect .mind .ch .vis { flex: 1; display: flex; align-items: center; height: 12px; }
    #inspect .mind .ch .val { width: 54px; text-align: right; opacity: .85;
                     font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #inspect .mind .mag { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; overflow: hidden; }
    #inspect .mind .mag > i { display: block; height: 100%; background: #6fb6e0; }
    #inspect .mind .mag.gate > i { background: #6fd08a; }
    #inspect .mind .bip { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; }
    #inspect .mind .bip::before { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
                         width: 1px; background: #ffffff26; }
    #inspect .mind .bip > i { position: absolute; top: 0; bottom: 0; background: #d0a86f; border-radius: 2px; }
    #inspect .mind .brg { display: inline-block; font-size: 14px; line-height: 1; color: #a6d8ff;
                 transform-origin: 50% 50%; }
    #inspect .mind .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3f4a; box-shadow: inset 0 0 0 1px #0004; }
    #inspect .mind .dot.on { background: #e06f6f; box-shadow: 0 0 4px #e06f6faa; }
    #inspect .mind .chip { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #2a2e36; }
    #inspect .mind .chip.good { background: #2f6b2855; color: #cdeecd; }
    #inspect .mind .chip.bad { background: #6b282855; color: #eecdcd; }
    #inspect .mind .regs { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #inspect .mind .reg { font: 11px ui-monospace, Menlo, Consolas, monospace; opacity: .55; }
    /* A channel attention had no room for: zero on the wire, but not empty. */
    #inspect .mind .crowded { font-style: normal; font-size: 10px; opacity: .5; color: #e6b877; }
    #inspect .mind .reg b { opacity: .95; font-weight: 600; }
    #inspect .mind .save { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                  border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    #inspect .mind .prog { background: #10121688; border-radius: 6px; padding: 6px 8px; margin-top: 2px;
                  overflow-x: auto; }
    #inspect .mind .prog .ins { white-space: pre; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; opacity: .82; }
    #inspect .mind .prog .ins.in { color: #8fd0f0; }   /* reads a sensor  */
    #inspect .mind .prog .ins.out { color: #8fe0a8; }  /* writes an actuator */
    #inspect .mind .prog .ins.ctl { color: #e0c88f; }  /* control flow (skip) */
    #inspect .mind .prog .ins.pc { background: #2f6b2855; color: #eafbe8; opacity: 1; border-radius: 3px; }
    #inspect .bar { height: 5px; border-radius: 3px; background: #3a3f4a; overflow: hidden; margin-top: 2px; }
    #inspect .bar > i { display: block; height: 100%; background: #6fb6e0; }
    #minimap { position: fixed; right: max(8px, env(safe-area-inset-right));
               bottom: max(8px, env(safe-area-inset-bottom)); z-index: var(--z-minimap);
               border: 1px solid #3a3f4a; border-radius: 6px; background: #10121688;
               width: 150px; height: auto; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="app"><canvas id="cv"></canvas><canvas id="fx"></canvas></div>
  <div id="hud"></div>
  <div id="bar">
    <button id="level" title="switch level" style="display:none"></button>
    <button id="drone" title="go to the next steward drone and follow it" style="display:none">drone</button>
    <button id="pause">pause</button>
    <select id="speed" title="simulation speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <select id="spawn" title="what a tap on open ground drops">
      <option value="" selected>tap: follow</option>
      <option value="food">tap: food</option>
      <option value="crate">tap: crate</option>
      <option value="hazard">tap: hazard</option>
      <option value="genome" disabled>tap: genome</option>
    </select>
    <button id="inject" title="load a .genome file, then use 'tap: genome' to place it">⤒ load genome</button>
    <input id="injectFile" type="file" accept=".genome,.txt,text/plain" style="display:none" />
    <button id="popBtn" title="population by role over time (p)">population</button>
    <button id="tuneBtn" title="every simulation constant (debug mode)" style="display:none">constants</button>
    <button id="ovlBtn" title="sense overlays: smell and sound heatmaps">overlays</button>
    <span id="stats">connecting…</span>
  </div>
  <div id="pop" class="panel half">
    <h3>population by
      <button id="popModeRoles" class="on" title="headcount by trophic role">role</button>
      <button id="popModeLin" title="headcount by species — watch lineages die out and get reseeded">lineage</button>
      <button id="popClade" style="display:none"
        title="cycle which clade the diagram shows — one clade at a time is far more legible, and no ribbon ever crosses clades, so filtering loses nothing">all clades</button>
      <span class="win" id="popWin"></span>
      <span class="szbtn" title="full screen">⛶</span><span class="x" title="close">✕</span></h3>
    <canvas id="popCv"></canvas>
    <div id="popKey"></div>
  </div>
  <div id="ovl" class="panel menu">
    <h3>sense overlays<span class="x" title="close">✕</span></h3>
    <label><input type="checkbox" id="ovlSmell" />
      <span class="sw" style="background:#e628be"></span>smell — pheromone clouds</label>
    <label><input type="checkbox" id="ovlSound" />
      <span class="sw" style="background:#f2b84b"></span>sound — events in earshot</label>
  </div>
  <div id="tuning" class="panel half">
    <h3>simulation constants<span class="szbtn" title="full screen">⛶</span><span
      class="x" title="close">✕</span></h3>
    <div id="tuneBody"></div>
    <div class="foot" id="tuneFoot"></div>
  </div>
  <div id="toast"></div>
  <div id="inspect" class="panel"></div>
  <canvas id="minimap" width="150" height="90"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
