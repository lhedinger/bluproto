<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#14161a" />
  <title>Evarium — Live World — Early Alpha</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #cfd3da;
                 font: 14px system-ui, sans-serif; overflow: hidden;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; inset: 0; }
    /* The vector overlay the WebGL path draws rings/doors/badges onto; it
       tracks #cv exactly and never takes pointer events. */
    #fx { position: absolute; inset: 0; pointer-events: none; }
    #hud { position: fixed; right: 8px; bottom: 8px; z-index: 5; display: none;
           font: 11px/1.5 ui-monospace, monospace; color: #cfd6e4;
           background: rgba(10,12,16,0.75); padding: 6px 8px; border-radius: 6px;
           white-space: pre; pointer-events: none; }
    /* The population graph: headcount by trophic role over time. Sits above the
       bar and away from the inspect panel (bottom-left) and minimap. Its canvas
       is drawn at device resolution and CSS-scaled down, so the 1px series lines
       stay sharp on a phone -- unlike the world canvas it is a chart, not art,
       so `pixelated` would be exactly wrong here. */
    /* Panels come in two sizes, half and full, and nothing else: a chart worth
       opening is worth reading, and a postage-stamp card was neither. Half is a
       right-hand column taking half the viewport's height; .full fills the
       viewport under the toolbar. The canvas flexes to whatever the panel is
       given and redraws at that size. New panels follow this convention. */
    #pop { position: fixed; right: max(8px, env(safe-area-inset-right));
           top: 52px; width: min(480px, calc(100vw - 16px)); height: 50vh;
           z-index: 5; display: none; flex-direction: column;
           background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
           padding: 8px 10px 6px; backdrop-filter: blur(4px); }
    #pop.open { display: flex; }
    #pop.full { left: max(8px, env(safe-area-inset-left)); width: auto;
                bottom: 8px; height: auto; }
    #pop h3 .size { margin-left: 2px; opacity: .55; }
    #pop h3 .size:hover { opacity: 1; }
    #pop h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; opacity: .85;
              display: flex; align-items: center; gap: 10px; }
    #pop h3 .win { margin-left: auto; opacity: .6; font-weight: 400;
                   font-variant-numeric: tabular-nums; }
    #popCv { width: 100%; flex: 1; min-height: 0; display: block;
             image-rendering: auto; touch-action: auto; }
    /* Wraps: the lineage lens can carry a dozen-plus species where roles have
       four, and a legend that clips is a legend that lies by omission. */
    #popKey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px;
              font: 11px/1.6 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    #pop h3 button { background: none; border: none; color: inherit; font: inherit;
                     padding: 0; cursor: pointer; opacity: .45; }
    #pop h3 button.on { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    #ovl { position: fixed; right: max(8px, env(safe-area-inset-right));
           top: 52px; z-index: 6; display: none;
           background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
           padding: 8px 12px; backdrop-filter: blur(4px); }
    #ovl label { display: flex; align-items: center; gap: 8px; padding: 4px 0;
                 font-size: 12px; cursor: pointer; user-select: none; }
    #ovl .sw { width: 11px; height: 11px; border-radius: 50%; opacity: .85; }
    /* Same two sizes as #pop: half by default, .full under the toolbar. */
    #tuning { position: fixed; right: max(8px, env(safe-area-inset-right));
              top: 52px; width: min(420px, calc(100vw - 16px)); z-index: 6; display: none;
              max-height: 50vh; overflow-y: auto;
              -webkit-overflow-scrolling: touch;
              background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
              padding: 10px 12px; backdrop-filter: blur(4px); }
    #tuning h3 { position: sticky; top: 0; z-index: 2; margin: -10px -12px 6px;
                 padding: 10px 12px 6px; background: #1d2026; font-size: 13px;
                 border-bottom: 1px solid #ffffff14; display: flex;
                 align-items: center; gap: 6px; }
    #tuning h3 .x { margin-left: auto; cursor: pointer; opacity: .7; }
    #tuning.full { left: max(8px, env(safe-area-inset-left)); width: auto;
                   bottom: 8px; max-height: none; }
    #tuning .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase;
                   letter-spacing: .06em; opacity: .5;
                   border-top: 1px solid #ffffff14; padding-top: 6px; }
    #tuning .trow { display: flex; align-items: center; gap: 8px; padding: 2px 0;
                    font-size: 11px; }
    #tuning .trow .tname { flex: 0 0 118px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; opacity: .8;
                           font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #tuning .trow input[type=range] { flex: 1 1 auto; min-width: 60px; }
    #tuning .trow input[type=number] { flex: 0 0 78px; background: #14161a;
                                       color: inherit; border: 1px solid #3a3f4a;
                                       border-radius: 5px; padding: 2px 4px;
                                       font: 11px ui-monospace, monospace; }
    #tuning .trow input:disabled { opacity: .45; }
    #tuning .trow .tunit { flex: 0 0 96px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; opacity: .55; font-size: 10px; }
    #tuning .trow .lock { flex: 0 0 12px; opacity: .5; font-size: 10px; }
    #tuning .trow.changed .tname { color: #d6b16a; opacity: 1; }
    #tuning .foot { position: sticky; bottom: -10px; margin: 8px -12px -10px;
                    padding: 8px 12px 10px; background: #1d2026;
                    border-top: 1px solid #ffffff14; display: flex; gap: 8px;
                    align-items: center; }
    #tuning .foot .note { opacity: .55; font-size: 11px; }
    #tuning .foot button { margin-left: auto; }
    #popKey span { display: flex; align-items: center; gap: 5px; cursor: pointer;
                   -webkit-tap-highlight-color: transparent; }
    #popKey span.off { opacity: .4; }
    #popKey i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    /* image-rendering: the world canvas renders at 1x CSS pixels (see resize()
       in main.ts) and the browser upscales it on hiDPI displays — pixelated
       keeps the fat art-pixels crisp instead of smearing them. */
    canvas { display: block; width: 100%; height: 100%; touch-action: none;
             image-rendering: pixelated; }
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px;
           align-items: center; padding: max(6px, env(safe-area-inset-top)) 8px 6px;
           background: linear-gradient(#14161ae0, #14161a00); z-index: 2; flex-wrap: wrap; }
    #bar button, #bar select { background: #2a2e36cc; color: #cfd3da; border: 1px solid #3a3f4a;
           border-radius: 6px; padding: 6px 12px; font: inherit; backdrop-filter: blur(3px); }
    #bar button.on { background: #2f6b28; border-color: #3f8f35; }
    #bar button:disabled, #bar select:disabled { opacity: .4; cursor: not-allowed; }
    #stats { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
             transform: translateX(-50%); background: #2a2e36ee; border: 1px solid #3a3f4a;
             border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity .25s;
             pointer-events: none; z-index: 10; } /* above minimap (3), inspect (5), mind (6) */
    #inspect { position: fixed; left: max(8px, env(safe-area-inset-left));
               bottom: max(8px, env(safe-area-inset-bottom)); width: min(240px, 46vw);
               background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
               padding: 10px 12px; z-index: 5; display: none; backdrop-filter: blur(4px); }
    /* The DEBUG inspector is a panel, so it takes a panel's two sizes (see
       #pop): full screen under the toolbar by default — it is the place a
       whole creature is studied — with the ⊟ in its header dropping it to the
       half column. The plain entity card above keeps its small self: it is a
       caption on the world, not a panel over it. */
    #inspect .tabs { display: flex; gap: 2px; margin: 0 0 8px;
                     border-bottom: 1px solid #ffffff14; }
    #inspect .tabs button { background: none; border: none; color: inherit;
                            font: 12px system-ui, sans-serif; padding: 4px 10px;
                            cursor: pointer; opacity: .5; border-bottom: 2px solid transparent; }
    #inspect .tabs button.on { opacity: 1; border-bottom-color: #7aa2f7; }
    #inspect .lin { font-size: 12px; }
    #inspect .lin .node { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
    #inspect .lin .node.link { cursor: pointer; }
    #inspect .lin .node.link:hover { background: #ffffff0a; }
    #inspect .lin .up { opacity: .45; width: 14px; text-align: center; }
    #inspect .lin .who { flex: 1; }
    #inspect .lin .meta { opacity: .6; font-variant-numeric: tabular-nums; }
    #inspect .lin .dead { opacity: .55; }
    #inspect .lin .end { opacity: .5; font-style: italic; padding: 4px 0 2px 21px; }
    /* The window title stays put while the body scrolls under it. Negative
       margins bleed it over the panel's own padding so nothing peeks past its
       edges, and the padding puts the inset back visually. Opaque (not the
       panel's translucent fill) so rows can't show through as they pass. */
    #inspect h3, #mind h3 { position: sticky; top: 0; z-index: 2;
                            margin: -10px -12px 6px; padding: 10px 12px 6px;
                            background: #1d2026; border-bottom: 1px solid #ffffff14; }
    #inspect h3 { font-size: 13px; display: flex; align-items: center; gap: 6px; }
    #inspect .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; }
    #inspect .x { margin-left: 8px; cursor: pointer; opacity: .7; }
    #inspect .szbtn { margin-left: auto; cursor: pointer; opacity: .55; }
    #inspect h3:not(:has(.szbtn)) .x { margin-left: auto; }
    #inspect table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #inspect td { padding: 1px 0; }
    #inspect td.k { opacity: .6; }
    #inspect td.v { text-align: right; font-variant-numeric: tabular-nums;
                    word-break: break-word; max-width: 62%; }
    #inspect .mono { opacity: .7; font: 11px ui-monospace, Menlo, Consolas, monospace; }
    /* Debug context: a panel, so it takes a panel's two sizes (see #pop) —
       full screen under the toolbar by default, the ⊟ dropping it to the half
       column. It used to be a 340px card; two rules then disagreed about its
       width and the LATER one quietly won, which is why this is one rule. */
    #inspect.dbg { top: 52px; right: max(8px, env(safe-area-inset-right));
                   bottom: 8px; width: auto; max-height: none;
                   overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #inspect.dbg.halfsize { left: auto; width: min(480px, calc(100vw - 16px));
                            height: 50vh; bottom: auto; }
    #inspect .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase;
                    letter-spacing: .06em; opacity: .5; border-top: 1px solid #ffffff14;
                    padding-top: 6px; }
    #inspect h3 + .grp { border-top: 0; padding-top: 0; margin-top: 2px; }
    #inspect .mindlink { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                         border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    /* Mind inspector: the creature's evolvable program, live I/O and registers. */
    #mind { position: fixed; left: max(8px, env(safe-area-inset-left));
            bottom: max(8px, env(safe-area-inset-bottom)); width: min(360px, 92vw);
            max-height: min(72vh, 640px); overflow-y: auto; -webkit-overflow-scrolling: touch;
            background: #1d2026f2; border: 1px solid #3a3f4a; border-radius: 10px;
            padding: 10px 12px; z-index: 6; display: none; backdrop-filter: blur(4px); }
    #mind h3 { font-size: 13px; display: flex; align-items: center; gap: 8px; }
    #mind h3 .back { margin-left: auto; cursor: pointer; opacity: .85; font-size: 12px; }
    #mind h3 .x { cursor: pointer; opacity: .7; }
    #mind .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                 opacity: .5; border-top: 1px solid #ffffff14; padding-top: 6px; }
    #mind .mono { font: 11px ui-monospace, Menlo, Consolas, monospace; }
    /* The plain-language "what is it doing" headline, decoded from actuators. */
    #mind .doing { margin: 2px 0 4px; font-size: 13px; color: #eafbe8; }
    #mind .doing::before { content: '▶ '; opacity: .55; }
    /* One I/O channel: name · shape-appropriate visual · value. Inert channels
       dim so the live ones read first; a firing actuator gets a lit row. */
    #mind .ch { display: flex; align-items: center; gap: 8px; padding: 1.5px 0; font-size: 12px; }
    #mind .ch.dim { opacity: .34; }
    #mind .ch.fire { background: #2f6b2833; border-radius: 4px; }
    #mind .ch .nm { width: 33%; opacity: .72; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mind .ch .vis { flex: 1; display: flex; align-items: center; height: 12px; }
    #mind .ch .val { width: 54px; text-align: right; opacity: .85;
                     font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #mind .mag { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; overflow: hidden; }
    #mind .mag > i { display: block; height: 100%; background: #6fb6e0; }
    #mind .mag.gate > i { background: #6fd08a; }
    #mind .bip { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; }
    #mind .bip::before { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
                         width: 1px; background: #ffffff26; }
    #mind .bip > i { position: absolute; top: 0; bottom: 0; background: #d0a86f; border-radius: 2px; }
    #mind .brg { display: inline-block; font-size: 14px; line-height: 1; color: #a6d8ff;
                 transform-origin: 50% 50%; }
    #mind .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3f4a; box-shadow: inset 0 0 0 1px #0004; }
    #mind .dot.on { background: #e06f6f; box-shadow: 0 0 4px #e06f6faa; }
    #mind .chip { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #2a2e36; }
    #mind .chip.good { background: #2f6b2855; color: #cdeecd; }
    #mind .chip.bad { background: #6b282855; color: #eecdcd; }
    #mind .regs { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #mind .reg { font: 11px ui-monospace, Menlo, Consolas, monospace; opacity: .55; }
    /* A channel attention had no room for: zero on the wire, but not empty. */
    #mind .crowded { font-style: normal; font-size: 10px; opacity: .5; color: #e6b877; }
    #mind .reg b { opacity: .95; font-weight: 600; }
    #mind .save { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                  border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    #mind .prog { background: #10121688; border-radius: 6px; padding: 6px 8px; margin-top: 2px;
                  overflow-x: auto; }
    #mind .prog .ins { white-space: pre; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; opacity: .82; }
    #mind .prog .ins.in { color: #8fd0f0; }   /* reads a sensor  */
    #mind .prog .ins.out { color: #8fe0a8; }  /* writes an actuator */
    #mind .prog .ins.ctl { color: #e0c88f; }  /* control flow (skip) */
    #mind .prog .ins.pc { background: #2f6b2855; color: #eafbe8; opacity: 1; border-radius: 3px; }
    #inspect .bar { height: 5px; border-radius: 3px; background: #3a3f4a; overflow: hidden; margin-top: 2px; }
    #inspect .bar > i { display: block; height: 100%; background: #6fb6e0; }
    #minimap { position: fixed; right: max(8px, env(safe-area-inset-right));
               bottom: max(8px, env(safe-area-inset-bottom)); z-index: 3;
               border: 1px solid #3a3f4a; border-radius: 6px; background: #10121688;
               width: 150px; height: auto; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="app"><canvas id="cv"></canvas><canvas id="fx"></canvas></div>
  <div id="hud"></div>
  <div id="bar">
    <button id="level" title="switch level" style="display:none"></button>
    <button id="drone" title="go to the next steward drone and follow it" style="display:none">drone</button>
    <button id="pause">pause</button>
    <select id="speed" title="simulation speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <select id="spawn" title="what a tap on open ground drops">
      <option value="" selected>tap: follow</option>
      <option value="food">tap: food</option>
      <option value="crate">tap: crate</option>
      <option value="hazard">tap: hazard</option>
      <option value="genome" disabled>tap: genome</option>
    </select>
    <button id="inject" title="load a .genome file, then use 'tap: genome' to place it">⤒ load genome</button>
    <input id="injectFile" type="file" accept=".genome,.txt,text/plain" style="display:none" />
    <button id="popBtn" title="population by role over time (p)">population</button>
    <button id="tuneBtn" title="every simulation constant (debug mode)" style="display:none">constants</button>
    <button id="ovlBtn" title="sense overlays: smell and sound heatmaps">overlays</button>
    <span id="stats">connecting…</span>
  </div>
  <div id="pop">
    <h3>population by
      <button id="popModeRoles" class="on" title="headcount by trophic role">role</button>
      <button id="popModeLin" title="headcount by species — watch lineages die out and get reseeded">lineage</button>
      <span class="win" id="popWin"></span>
      <button id="popSize" class="size" title="full screen">⛶</button></h3>
    <canvas id="popCv"></canvas>
    <div id="popKey"></div>
  </div>
  <div id="ovl">
    <label><input type="checkbox" id="ovlSmell" />
      <span class="sw" style="background:#e628be"></span>smell — pheromone clouds</label>
    <label><input type="checkbox" id="ovlSound" />
      <span class="sw" style="background:#f2b84b"></span>sound — events in earshot</label>
  </div>
  <div id="tuning">
    <h3>simulation constants<span class="x" id="tuneSize" title="full screen"
      style="margin-left:auto;cursor:pointer;opacity:.55">⛶</span>
      <span class="x" id="tuneClose" title="close" style="margin-left:8px">✕</span></h3>
    <div id="tuneBody"></div>
    <div class="foot" id="tuneFoot"></div>
  </div>
  <div id="toast"></div>
  <div id="inspect"></div>
  <div id="mind"></div>
  <canvas id="minimap" width="150" height="90"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
