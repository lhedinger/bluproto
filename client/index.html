<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#14161a" />
  <title>Evarium — Live World — Early Alpha</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #cfd3da;
                 font: 14px system-ui, sans-serif; overflow: hidden;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px;
           align-items: center; padding: max(6px, env(safe-area-inset-top)) 8px 6px;
           background: linear-gradient(#14161ae0, #14161a00); z-index: 2; flex-wrap: wrap; }
    #bar button, #bar select { background: #2a2e36cc; color: #cfd3da; border: 1px solid #3a3f4a;
           border-radius: 6px; padding: 6px 12px; font: inherit; backdrop-filter: blur(3px); }
    #bar button.on { background: #2f6b28; border-color: #3f8f35; }
    #bar button:disabled, #bar select:disabled { opacity: .4; cursor: not-allowed; }
    #stats { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
             transform: translateX(-50%); background: #2a2e36ee; border: 1px solid #3a3f4a;
             border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity .25s;
             pointer-events: none; z-index: 3; }
    #inspect { position: fixed; left: max(8px, env(safe-area-inset-left));
               bottom: max(8px, env(safe-area-inset-bottom)); width: min(240px, 46vw);
               background: #1d2026ee; border: 1px solid #3a3f4a; border-radius: 10px;
               padding: 10px 12px; z-index: 5; display: none; backdrop-filter: blur(4px); }
    #inspect h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    #inspect .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; }
    #inspect .x { margin-left: auto; cursor: pointer; opacity: .7; }
    #inspect table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #inspect td { padding: 1px 0; }
    #inspect td.k { opacity: .6; }
    #inspect td.v { text-align: right; font-variant-numeric: tabular-nums;
                    word-break: break-word; max-width: 62%; }
    #inspect .mono { opacity: .7; font: 11px ui-monospace, Menlo, Consolas, monospace; }
    /* Debug context: a wider, scrollable dump grouped into sections. Sized to stay
       inside the viewport on a phone and scroll rather than run off-screen. */
    #inspect.dbg { width: min(340px, 84vw); max-height: min(62vh, 560px);
                   overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #inspect .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase;
                    letter-spacing: .06em; opacity: .5; border-top: 1px solid #ffffff14;
                    padding-top: 6px; }
    #inspect h3 + .grp { border-top: 0; padding-top: 0; margin-top: 2px; }
    #inspect .mindlink { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                         border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    /* Mind inspector: the creature's evolvable program, live I/O and registers. */
    #mind { position: fixed; left: max(8px, env(safe-area-inset-left));
            bottom: max(8px, env(safe-area-inset-bottom)); width: min(360px, 92vw);
            max-height: min(72vh, 640px); overflow-y: auto; -webkit-overflow-scrolling: touch;
            background: #1d2026f2; border: 1px solid #3a3f4a; border-radius: 10px;
            padding: 10px 12px; z-index: 6; display: none; backdrop-filter: blur(4px); }
    #mind h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    #mind h3 .back { margin-left: auto; cursor: pointer; opacity: .85; font-size: 12px; }
    #mind h3 .x { cursor: pointer; opacity: .7; }
    #mind .grp { margin: 9px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                 opacity: .5; border-top: 1px solid #ffffff14; padding-top: 6px; }
    #mind .mono { font: 11px ui-monospace, Menlo, Consolas, monospace; }
    /* The plain-language "what is it doing" headline, decoded from actuators. */
    #mind .doing { margin: 2px 0 4px; font-size: 13px; color: #eafbe8; }
    #mind .doing::before { content: '▶ '; opacity: .55; }
    /* One I/O channel: name · shape-appropriate visual · value. Inert channels
       dim so the live ones read first; a firing actuator gets a lit row. */
    #mind .ch { display: flex; align-items: center; gap: 8px; padding: 1.5px 0; font-size: 12px; }
    #mind .ch.dim { opacity: .34; }
    #mind .ch.fire { background: #2f6b2833; border-radius: 4px; }
    #mind .ch .nm { width: 33%; opacity: .72; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mind .ch .vis { flex: 1; display: flex; align-items: center; height: 12px; }
    #mind .ch .val { width: 54px; text-align: right; opacity: .85;
                     font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #mind .mag { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; overflow: hidden; }
    #mind .mag > i { display: block; height: 100%; background: #6fb6e0; }
    #mind .mag.gate > i { background: #6fd08a; }
    #mind .bip { position: relative; flex: 1; height: 4px; background: #2a2e36; border-radius: 2px; }
    #mind .bip::before { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
                         width: 1px; background: #ffffff26; }
    #mind .bip > i { position: absolute; top: 0; bottom: 0; background: #d0a86f; border-radius: 2px; }
    #mind .brg { display: inline-block; font-size: 14px; line-height: 1; color: #a6d8ff;
                 transform-origin: 50% 50%; }
    #mind .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3f4a; box-shadow: inset 0 0 0 1px #0004; }
    #mind .dot.on { background: #e06f6f; box-shadow: 0 0 4px #e06f6faa; }
    #mind .chip { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #2a2e36; }
    #mind .chip.good { background: #2f6b2855; color: #cdeecd; }
    #mind .chip.bad { background: #6b282855; color: #eecdcd; }
    #mind .regs { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #mind .reg { font: 11px ui-monospace, Menlo, Consolas, monospace; opacity: .55; }
    #mind .reg b { opacity: .95; font-weight: 600; }
    #mind .save { margin-top: 10px; text-align: center; color: #a6d8ff; cursor: pointer;
                  border: 1px solid #2f6b7a; background: #24404a80; border-radius: 6px; padding: 7px; }
    #mind .prog { background: #10121688; border-radius: 6px; padding: 6px 8px; margin-top: 2px;
                  overflow-x: auto; }
    #mind .prog .ins { white-space: pre; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; opacity: .82; }
    #mind .prog .ins.in { color: #8fd0f0; }   /* reads a sensor  */
    #mind .prog .ins.out { color: #8fe0a8; }  /* writes an actuator */
    #mind .prog .ins.ctl { color: #e0c88f; }  /* control flow (skip) */
    #mind .prog .ins.pc { background: #2f6b2855; color: #eafbe8; opacity: 1; border-radius: 3px; }
    #inspect .bar { height: 5px; border-radius: 3px; background: #3a3f4a; overflow: hidden; margin-top: 2px; }
    #inspect .bar > i { display: block; height: 100%; background: #6fb6e0; }
    #minimap { position: fixed; right: max(8px, env(safe-area-inset-right));
               bottom: max(8px, env(safe-area-inset-bottom)); z-index: 3;
               border: 1px solid #3a3f4a; border-radius: 6px; background: #10121688;
               width: 150px; height: auto; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="app"><canvas id="cv"></canvas></div>
  <div id="bar">
    <button id="level" title="switch level" style="display:none"></button>
    <button id="pause">pause</button>
    <select id="speed" title="simulation speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <select id="spawn" title="what a tap on open ground drops">
      <option value="" selected>tap: follow</option>
      <option value="food">tap: food</option>
      <option value="crate">tap: crate</option>
      <option value="hazard">tap: hazard</option>
    </select>
    <button id="inject" title="inject a saved .genome at the view centre">⤒ inject</button>
    <input id="injectFile" type="file" accept=".genome,.txt,text/plain" style="display:none" />
    <span id="stats">connecting…</span>
  </div>
  <div id="toast"></div>
  <div id="inspect"></div>
  <div id="mind"></div>
  <canvas id="minimap" width="150" height="90"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
