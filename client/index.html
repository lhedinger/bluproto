<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14161a" />
  <title>Evarium — Live World — Early Alpha</title>
  <!-- Bulkhead, the design system (client/src/bulkhead.css; reference at /help/design). -->
  <link rel="stylesheet" href="/src/bulkhead.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: var(--ink);
                 font: 13px/1.45 var(--f-ui); overflow: hidden;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* Every floating surface stacks on this scale rather than on a number
       somebody picked in the moment. The panels all share one layer because
       only one of them is ever open (see .panel below). */
    :root { --z-bar: 2; --z-minimap: 3; --z-panel: 5; --z-dialog: 8; --z-toast: 10;
            /* What the bottom corners hold up, measured from the bottom inset: the
               status plate and its gap, and the minimap with its ring and gap.
               Whatever sits above one of them clears it by these. */
            --stats-top: 34px; --mm-top: 104px;
            /* How far down a panel starts. Measured from the toolbar itself
               (see syncBarHeight in main.ts) because the toolbar WRAPS: on a
               phone it is two rows, and the 52px every panel used to assume
               was one row's worth, so a panel opened over its own buttons. */
            --bar-h: 52px; }
    #app { position: fixed; inset: 0; }
    /* The vector overlay the WebGL path draws rings/doors/badges onto; it
       tracks #cv exactly and never takes pointer events. */
    #fx { position: absolute; inset: 0; pointer-events: none; }

    /* ---- the panel system ------------------------------------------------
       Every box that floats over the world is one of four things, and they all
       share the chrome below so they cannot drift apart. Only the ANCHOR
       differs:

         .card   a caption on the world — bottom left, sized to its content
         .menu   a drop-down from a toolbar button — top right, sized to fit
         .half   a panel: the right-hand column, half the viewport high
         .full   a panel: everything under the toolbar

       .half and .full are the two sizes a panel swaps between with the ⛶/⊟ in
       its own header. A card and a menu have no sizes to swap: a thing that
       only makes sense small is a caption on the world, not a panel over it,
       and blowing four rows of tile facts up to full screen is how the tile
       inspector used to open.

       The menu and both panel sizes claim the same top-right anchor, so
       opening one closes the others — see claimRightColumn() in main.ts. Two
       open at once was two boxes fighting over one corner, with the winner
       decided by a z-index nobody had chosen on purpose. */
    /* border-box so a declared width is the width on screen: content-box quietly
       added the 12px sides and the border, and the "480px" half column measured
       506. Sizes that do not mean what they say are how two of them drifted
       apart in the first place. */
    .panel { position: fixed; z-index: var(--z-panel); box-sizing: border-box;
             display: none; flex-direction: column; overflow-y: auto;
             -webkit-overflow-scrolling: touch;
             /* Bulkhead steel: an opaque plate with a 2px bevel and its corners
                left open, never a rounded translucent card. */
             background: var(--s0); border: 0; border-radius: 0; padding: 0 12px 10px;
             box-shadow: 0 -2px 0 0 var(--s2), -2px 0 0 0 var(--s2), 2px 0 0 0 var(--sh),
                         0 2px 0 0 var(--sh), 0 6px 0 0 #0007; }
    .panel.open { display: flex; }
    .panel.card { left: max(8px, env(safe-area-inset-left));
                  bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--stats-top)); /* above the status readout */
                  width: min(240px, 46vw); }
    .panel.menu { top: var(--bar-h); right: max(8px, env(safe-area-inset-right)); }
    .panel.half { top: var(--bar-h); right: max(8px, env(safe-area-inset-right));
                  width: min(480px, calc(100vw - 16px)); height: 50vh; height: 50dvh; }
    .panel.full { top: var(--bar-h); right: max(8px, env(safe-area-inset-right));
                  left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); }
    /* a menu longer than the screen scrolls inside itself rather than off the bottom */
    .panel.menu { max-height: calc(100vh - var(--bar-h) - 16px); max-height: calc(100dvh - var(--bar-h) - 16px); }
    /* The title stays put while the body scrolls under it. Opaque — not the
       panel's translucent fill — so rows cannot show through as they pass, and
       full-bleed sideways via negative SIDE margins against the panel's own
       side padding.

       It owns the panel's TOP padding rather than reaching back over it with a
       negative top margin. A sticky offset constrains the MARGIN box, so
       `margin-top: -10px` with `top: 0` parks the header ten pixels lower than
       flush the moment it sticks, and the panel's top padding becomes a window
       onto the text scrolling underneath. That looked right at rest and fought
       the element only while doing its job, which is why it shipped twice. */
    .panel > h3 { position: sticky; top: 0; z-index: 2; flex: 0 0 auto;
                  margin: 0 -12px 8px; padding: 6px 6px 6px 12px; min-height: 40px;
                  box-sizing: border-box; background: var(--s1); color: var(--ink);
                  box-shadow: inset 0 -2px 0 0 var(--sh), inset 0 2px 0 0 var(--s2);
                  font: 400 13px var(--f-label); letter-spacing: .06em;
                  display: flex; align-items: center; gap: 8px; }
    .panel > h3 .mono { font: 11px var(--f-ui); letter-spacing: 0; opacity: .7; }
    .panel > h3 .sw { width: 12px; height: 12px; flex: none; box-shadow: 0 0 0 2px var(--sh); }
    /* The size toggle sits hard right, the close after it. They wear DIFFERENT
       classes on purpose: the close wiring takes the first `.x` it finds, and a
       size toggle that closed the panel would be a trap. */
    /* Both are Bulkhead icon plates: raised, and sinking when pressed. */
    .panel > h3 .szbtn, .panel > h3 .x {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; position: relative; top: 0; cursor: pointer; border: 0; padding: 0;
      font: 13px var(--f-ui); letter-spacing: 0; color: var(--ink); background: var(--s1);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 -2px 0 0 var(--s2), -2px 0 0 0 var(--s2), 2px 0 0 0 var(--sh),
                  0 2px 0 0 var(--sh), 0 4px 0 0 #0009; }
    .panel > h3 .szbtn { margin-left: auto; }
    .panel > h3 .x { margin-left: 4px; }
    @media (hover: hover) { .panel > h3 .szbtn:hover, .panel > h3 .x:hover { background: var(--s2); } }
    .panel > h3 .szbtn:active, .panel > h3 .x:active { top: 2px; background: var(--s0);
      box-shadow: 0 -2px 0 0 var(--sh), -2px 0 0 0 var(--sh), 2px 0 0 0 var(--s2), 0 2px 0 0 var(--s2); }
    @container bh (max-width: 599px) {
      .panel > h3 { min-height: 34px; padding: 5px 6px 5px 10px; font-size: 12px; }
      .panel > h3 .szbtn, .panel > h3 .x { width: 24px; height: 24px; font-size: 12px; }
      /* compact: every corner panel is a sheet from the bottom edge */
      /* Sheets sit on the bottom edge and pad past the home indicator; dvh so the
         browser's own collapsing toolbar does not push their foot off screen. */
      .panel.half, .panel.menu, .panel.full, .panel.card { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      .panel.half, .panel.menu { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: auto; max-height: 62vh; max-height: 62dvh;
        box-shadow: 0 -2px 0 0 var(--s2), 0 -6px 0 0 #0007; }
      .panel.half { height: 62vh; height: 62dvh; }
      .panel.full { left: 0; right: 0; bottom: 0; box-shadow: 0 -2px 0 0 var(--s2); }
      .panel.card { left: 0; right: 0; bottom: 0; width: auto; box-shadow: 0 -2px 0 0 var(--s2), 0 -6px 0 0 #0007; }
    }
    .panel > h3:not(:has(.szbtn)) .x { margin-left: auto; }
    /* A landscape phone is wide enough for the desktop anchors but not tall
       enough for a half-height panel: it takes the height under the bar. */
    @media (max-height: 500px) {
      .panel.half { height: auto; bottom: max(8px, env(safe-area-inset-bottom)); }
    }
    #hud { position: fixed; right: max(8px, env(safe-area-inset-right)); top: calc(var(--bar-h) + 8px); /* clear of the minimap it used to sit on */ z-index: var(--z-panel);
           font: 11px/1.5 var(--f-ui); color: var(--ink);
           background: #14171de6; padding: 6px 8px; box-shadow: 0 0 0 2px var(--sh);
           white-space: pre; pointer-events: none; }
    /* The population graph. Its canvas is drawn at device resolution and
       CSS-scaled down, so the 1px series lines stay sharp on a phone -- unlike
       the world canvas it is a chart, not art, so `pixelated` would be exactly
       wrong here. The chart flexes to whatever size the panel was given and
       redraws there.
       The header: the title gives way first -- it shrinks to an ellipsis on a
       zero flex basis, so the choices and the size and close plates always share
       the first line -- and the window readout takes a line of its own under
       them at every width. Sharing the first line, the lineage lens's third
       choice left it no room at all. */
    #pop h3 { gap: 10px; flex-wrap: wrap; row-gap: 4px; }
    #pop h3 .ttl { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pop h3 .win { order: 9; flex-basis: 100%; opacity: .6; font: 11px var(--f-ui); letter-spacing: 0;
                   font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @container bh (max-width: 599px) {
      #pop h3 { gap: 6px; }
      #pop h3 button:not(.szbtn, .x) { padding: 4px 7px; font-size: 10px; }
    }
    #popCv { width: 100%; flex: 1; min-height: 0; display: block;
             image-rendering: auto; touch-action: auto; }
    /* Wraps: the lineage lens can carry a dozen-plus species where roles have
       four, and a legend that clips is a legend that lies by omission. */
    #popKey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px;
              font: 11px/1.6 var(--f-ui); font-variant-numeric: tabular-nums; }
    /* role / lineage / clade: a segmented choice set into the header */
    #pop h3 button:not(.szbtn, .x) { background: var(--lamp-h); border: none; color: var(--dim); cursor: pointer;
                     font: 400 11px var(--f-label); letter-spacing: .06em; padding: 5px 9px; margin: 0;
                     box-shadow: inset 0 2px 0 0 var(--sh); -webkit-tap-highlight-color: transparent; }
    #pop h3 button:not(.szbtn, .x).on { color: var(--lamp-l); background: var(--s0); box-shadow: inset 0 -2px 0 0 var(--s2); }
    #pop h3 #popClade { color: var(--ink); background: var(--s0); }
    /* Two checkboxes hanging off a toolbar button: a menu, sized by what it
       holds. The round swatch is the colour that overlay paints the world. */
    #ovl label { display: flex; align-items: center; gap: 10px; padding: 3px 0; min-height: 28px;
                 font-size: 13px; cursor: pointer; user-select: none; }
    #ovl .sw { width: 10px; height: 10px; flex: none; opacity: .9; box-shadow: 0 0 0 2px var(--sh); }
    @container bh (max-width: 599px) { #ovl label { min-height: var(--touch); } }
    /* a group heading: Bulkhead's label, over a shadow line */
    #tuning .grp, #inspect .grp { margin: 12px 0 4px; padding-top: 8px; box-shadow: inset 0 2px 0 0 var(--sh);
                   font: 500 11px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
    #tuning .trow { display: flex; align-items: center; gap: 8px; padding: 2px 0;
                    font-size: 12px; }
    #tuning .trow .tname { flex: 0 1 118px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; color: var(--dim);
                           font: 12px var(--f-ui); }
    #tuning .trow .bh-range { flex: 1 1 auto; min-width: 60px; margin: 8px 2px; }
    #tuning .trow input[type=number] { flex: 0 0 82px; width: 82px; font-variant-numeric: tabular-nums; }
    #tuning .trow input:disabled { opacity: .45; }
    #tuning .trow .tunit { flex: 0 1 96px; overflow: hidden; white-space: nowrap;
                           text-overflow: ellipsis; opacity: .55; font-size: 10px; }
    #tuning .trow .lock { flex: 0 0 12px; opacity: .5; font-size: 10px; }
    #tuning .trow.changed .tname { color: var(--amb1); opacity: 1; }
    #tuning .foot { position: sticky; bottom: -10px; margin: 8px -12px -10px;
                    padding: 10px 12px 12px; background: var(--s0);
                    box-shadow: inset 0 2px 0 0 var(--sh); display: flex; gap: 8px;
                    align-items: center; }
    #tuning .foot .note { color: var(--dim); font-size: 12px; }
    #tuning .foot button { margin-left: auto; }
    #popKey span { display: flex; align-items: center; gap: 5px; cursor: pointer;
                   -webkit-tap-highlight-color: transparent; }
    #popKey span.off { opacity: .4; }
    #popKey span.static { cursor: default; }
    /* the faint outer ring keeps a near-black species a swatch, not a gap */
    #popKey i { width: 9px; height: 9px; display: inline-block; background: var(--fill);
                box-shadow: inset 0 0 0 1px var(--ring, var(--fill)), 0 0 0 1px #ffffff2e; }
    /* image-rendering: the world canvas renders at 1x CSS pixels (see resize()
       in main.ts) and the browser upscales it on hiDPI displays — pixelated
       keeps the fat art-pixels crisp instead of smearing them. */
    canvas { display: block; width: 100%; height: 100%; touch-action: none;
             image-rendering: pixelated; }
    /* The toolbar: a dark well across the top, Bulkhead plates in it. */
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 4px 6px;
           align-items: center; padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
           background: #14171de6; box-shadow: inset 0 -2px 0 0 var(--sh); z-index: var(--z-bar); flex-wrap: wrap; }
    #bar select.bh-input { width: auto; }
    /* Wide screen: the groups sit in the row, a shadow line between them. The views
       group runs on from the population button beside it, so those read as one set. */
    #bar .bar-tools { display: contents; }
    #bar .bar-group { display: flex; align-items: center; gap: 4px; padding-left: 10px; margin-left: 4px;
                      box-shadow: inset 2px 0 0 0 var(--sh); }
    #bar .bar-group--views { padding-left: 0; margin-left: 0; box-shadow: none; }
    #bar .bar-glabel { display: none; }
    #popBtn { margin-left: 10px; }
    #barToggle { display: none; }
    .bar-burger { display: block; width: 14px; height: 10px;
      background: linear-gradient(currentColor 0 2px, transparent 2px 4px, currentColor 4px 6px, transparent 6px 8px, currentColor 8px 10px); }
    /* On a phone the toolbar is ONE row -- the floor stepper, population and the toggle --
       and the tools fold into a sheet that drops from under it. Wrapping them took three
       rows of a 844 px screen before the world began. */
    @container bh (max-width: 599px) {
      #bar { flex-wrap: nowrap; }
      #bar.open { z-index: calc(var(--z-panel) + 1); }
      #barToggle { display: inline-flex; flex: none; margin-left: auto; }
      #bar .bar-tools { display: none; }
      #bar.open .bar-tools { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: stretch;
        position: absolute; left: 0; right: 0; top: 100%; padding: 10px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
        background: var(--s0); box-shadow: 0 2px 0 0 var(--sh), 0 8px 0 0 #0007, inset 0 2px 0 0 var(--s2); }
      /* Phone sheet: one row per group, its label first and its controls after it at their
         own width, wrapping only when a group runs out of room. */
      #bar.open .bar-group, #bar.open .bar-group--views { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        padding: 0; margin: 0; box-shadow: none; }
      #bar.open .bar-glabel { display: block; flex: none; width: 84px; font-size: 10px; }
      #bar.open .bar-group > .bh-btn:not(.bh-btn--icon), #bar.open .bar-group > select { width: auto; margin: 2px; }
    }
    @container bh (max-width: 599px) { #bar { gap: 6px; } #bar select.bh-input--sm { padding-right: 26px; background-position: right 8px center; } }
    /* The status readout lives in the bottom-left corner, off the toolbar: a small dark
       plate, Bulkhead's readout type. It is still the triple-tap that toggles debug. The
       entity card opens above it rather than over it; on a phone the card is a sheet
       across the bottom and covers it while it is up. */
    #stats { position: fixed; z-index: var(--z-minimap); cursor: pointer; /* triple-tap toggles debug */
             left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom));
             max-width: calc(100vw - 190px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
             padding: 5px 8px; background: #14171de6; box-shadow: 0 0 0 2px var(--sh);
             font: 400 11px var(--f-label); letter-spacing: .04em; color: var(--dim);
             font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
    /* The floor rail is the phone's level control: a column on the right edge above the
       minimap, where a right thumb rests. A wide screen keeps the stepper in the toolbar. */
    #floorRail { position: fixed; z-index: var(--z-minimap); right: max(8px, env(safe-area-inset-right));
                 bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--mm-top)); display: none; }
    @container bh (max-width: 599px) {
      #floorRail:not([hidden]) { display: grid; }
      #bar .bh-level { display: none; }
      #popBtn { margin-left: 0; }
    }
    @container bh (max-width: 599px) {
      /* beside the minimap there is room for the tick and the count; the seed goes */
      #stats { font-size: 10px; max-width: calc(100vw - 186px); }
      #stats .stat-seed { display: none; }
    }
    /* Bulkhead's toast: a dark plate with one lit lamp. */
    #toast { position: fixed; bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--stats-top) + 6px); left: 50%; /* above the readout row */
             transform: translateX(-50%); background: var(--lamp-h); color: var(--ink);
             display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
             padding: 9px 12px; opacity: 0; transition: opacity .25s steps(3);
             box-shadow: 0 -2px 0 0 var(--s2), -2px 0 0 0 var(--s2), 2px 0 0 0 var(--sh), 0 2px 0 0 var(--sh), 0 4px 0 0 #0009;
             pointer-events: none; z-index: var(--z-toast); } /* above every panel */
    #toast.show { opacity: 1; }
    #toast::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--lamp-l); }
    @container bh (max-width: 599px) {
      #toast { bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--mm-top) + 4px); } /* clear of the minimap */
    }
    /* #inspect is three surfaces sharing one element, and which one it is at
       any moment is the ANCHOR class it wears (see the panel system above):
       the plain entity card and the tile dump are `.card`, the debug creature
       inspector is a `.full`/`.half` panel. It used to wear one class, `.dbg`,
       for all three — so four rows of tile facts opened full screen. */
    /* The tab bar is the panel's chrome, so it stays with the header instead of
       scrolling away with the content: a full genome dump or a mind listing is
       taller than the panel, and losing the tabs left no visible way out of the
       one you were in. It sticks BELOW the header — --inspect-head is that
       header's measured height, set in main.ts, because a wrapped title is
       taller than an unwrapped one. Opaque and full-bleed for the same reason
       the header is: rows must not show through as they pass under it. */
    #inspect .tabs { position: sticky; top: var(--inspect-head, 40px); z-index: 1;
                     display: flex; gap: 2px; margin: 0 -12px 8px;
                     padding: 0 10px; background: var(--s0); overflow-x: auto; scrollbar-width: none;
                     /* flex: none, or it vanishes: the panel is a flex column, and a child that
                        scrolls sideways may be shrunk to nothing once a long tab fills the panel */
                     flex: none;
                     box-shadow: inset 0 -2px 0 0 var(--sh); }
    #inspect .tabs button { background: none; border: none; color: var(--dim); flex: none;
                            font: 400 11px var(--f-label); letter-spacing: .06em; min-height: 34px; padding: 0 12px;
                            cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* the header gives up its bottom margin to the tabs instead of the tabs reaching back
       over it: a negative top margin on a sticky bar leaves a window once it sticks */
    #inspect > h3:has(+ .tabs) { margin-bottom: 0; }
    @media (hover: hover) { #inspect .tabs button:hover { color: var(--ink); } }
    #inspect .tabs button.on { color: var(--ink); background: var(--s1); box-shadow: inset 0 2px 0 0 var(--s2); }
    @container bh (max-width: 599px) { #inspect .tabs button { min-height: var(--touch); } }
    #inspect .lin { font-size: 12px; }
    /* The body scan: a canvas on the panel's own fill, centred, never scaled by
       CSS -- it is drawn at its cell size and a stretched cell is a blur. */
    #inspect .scan { display: flex; justify-content: center; padding: 8px 0; }
    #inspect .scan canvas { image-rendering: pixelated; box-shadow: 0 0 0 2px var(--sh); }
    #inspect .scan.card { padding: 4px 0 6px; }
    #inspect .lin .node { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
    #inspect .lin .node.link { cursor: pointer; }
    @media (hover: hover) { #inspect .lin .node.link:hover { background: #ffffff0a; } }
    #inspect .lin .up { opacity: .45; width: 14px; text-align: center; }
    #inspect .lin .who { flex: 1; }
    #inspect .lin .meta { opacity: .6; font-variant-numeric: tabular-nums; }
    #inspect .lin .dead { opacity: .55; }
    #inspect .lin .end { opacity: .5; font-style: italic; padding: 4px 0 2px 21px; }
    /* A row is a label on the left and its value on the right, so the row has to
       be narrow enough that the eye can carry one to the other. At 100% of a
       full-screen panel the two ended up 1200px apart with nothing in between —
       the layout was written when this was a 340px card and was never revisited
       when it became a panel. The cap is the width it reads well at; the panel
       keeps the rest of the space for the wide content (the mind's channels and
       program listing, which set their own widths). */
    #inspect table { width: 100%; max-width: 460px; border-collapse: collapse;
                     font-size: 12px; }
    #inspect td { padding: 1px 0; }
    #inspect td.k { color: var(--dim); }
    #inspect td.v { text-align: right; font-variant-numeric: tabular-nums;
                    word-break: break-word; }
    #inspect .mono { opacity: .7; font: 11px var(--f-ui); }
    #inspect h3 + .grp { box-shadow: none; padding-top: 0; margin-top: 2px; }
    /* the inspector's links are Bulkhead plates */
    #inspect .mind .save { display: block; width: calc(100% - 4px); border: 0; margin: 12px 2px 4px; text-align: center; cursor: pointer; position: relative; top: 0;
      font: 400 12px var(--f-label); letter-spacing: .06em; color: var(--ink); background: var(--s1); padding: 9px;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 -2px 0 0 var(--s2), -2px 0 0 0 var(--s2), 2px 0 0 0 var(--sh), 0 2px 0 0 var(--sh), 0 4px 0 0 #0009; }
    @media (hover: hover) { #inspect .mind .save:hover { background: var(--s2); } }
    #inspect .mind .save:active { top: 2px; background: var(--s0);
      box-shadow: 0 -2px 0 0 var(--sh), -2px 0 0 0 var(--sh), 2px 0 0 0 var(--s2), 0 2px 0 0 var(--s2); }
    /* The mind TAB of the inspector: the creature's evolvable program, live I/O
       and registers. It was a panel of its own, with its own frame, position
       and close button; as a tab it is only content, and the panel around it
       supplies the rest. Everything below is that content's own styling. */
    #inspect .mind .mono { font: 11px var(--f-ui); }
    /* The plain-language "what is it doing" headline, decoded from actuators. */
    #inspect .mind .doing { margin: 2px 0 4px; font-size: 13px; color: #eafbe8; }
    #inspect .mind .doing::before { content: '▶ '; opacity: .55; }
    /* One I/O channel: name · shape-appropriate visual · value. Inert channels
       dim so the live ones read first; a firing actuator gets a lit row. */
    #inspect .mind .ch { display: flex; align-items: center; gap: 8px; padding: 1.5px 0; font-size: 12px; }
    #inspect .mind .ch.dim { opacity: .34; }
    #inspect .mind .ch.fire { background: #2f6b2833; }
    #inspect .mind .ch .nm { width: 33%; opacity: .72; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #inspect .mind .ch .vis { flex: 1; display: flex; align-items: center; height: 12px; }
    #inspect .mind .ch .val { width: 54px; text-align: right; opacity: .85;
                     font: 11px var(--f-ui); }
    #inspect .mind .mag { position: relative; flex: 1; height: 4px; background: var(--lamp-h); overflow: hidden; }
    #inspect .mind .mag > i { display: block; height: 100%; background: #6fb6e0; }
    #inspect .mind .mag.gate > i { background: #6fd08a; }
    #inspect .mind .bip { position: relative; flex: 1; height: 4px; background: var(--lamp-h); }
    #inspect .mind .bip::before { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px;
                         width: 1px; background: #ffffff26; }
    #inspect .mind .bip > i { position: absolute; top: 0; bottom: 0; background: #d0a86f; }
    #inspect .mind .brg { display: inline-block; font-size: 14px; line-height: 1; color: #a6d8ff;
                 transform-origin: 50% 50%; }
    #inspect .mind .dot { width: 8px; height: 8px; background: var(--lamp-d); box-shadow: 0 0 0 2px var(--lamp-h); }
    #inspect .mind .dot.on { background: var(--red1); }
    #inspect .mind .chip { font: 400 10px var(--f-label); letter-spacing: .06em; padding: 2px 8px; background: var(--lamp-h); box-shadow: 0 0 0 2px var(--sh); }
    #inspect .mind .chip.good { background: #2f6b2855; color: #cdeecd; }
    #inspect .mind .chip.bad { background: #6b282855; color: #eecdcd; }
    #inspect .mind .regs { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #inspect .mind .reg { font: 11px var(--f-ui); opacity: .55; }
    /* A channel attention had no room for: zero on the wire, but not empty. */
    #inspect .mind .crowded { font-style: normal; font-size: 10px; opacity: .5; color: #e6b877; }
    #inspect .mind .reg b { opacity: .95; font-weight: 600; }
    #inspect .mind .prog { background: var(--lamp-h); padding: 6px 8px; margin: 4px 2px 2px; overflow-x: auto;
                  box-shadow: 0 -2px 0 0 var(--sh), 0 2px 0 0 var(--s2); }
    #inspect .mind .prog .ins { white-space: pre; font: 11px/1.5 var(--f-ui); opacity: .82; }
    #inspect .mind .prog .ins.in { color: #8fd0f0; }   /* reads a sensor  */
    #inspect .mind .prog .ins.out { color: #8fe0a8; }  /* writes an actuator */
    #inspect .mind .prog .ins.ctl { color: #e0c88f; }  /* control flow (skip) */
    #inspect .mind .prog .ins.pc { background: #2f6b2855; color: #eafbe8; opacity: 1; }
    /* Bulkhead's meter: a sunk well, the fill in dashed lamp light */
    #inspect .bar { height: 8px; background: var(--lamp-h); padding: 2px; overflow: hidden; margin: 4px 2px 2px;
                    box-shadow: 0 -2px 0 0 var(--sh), 0 2px 0 0 var(--s2); }
    #inspect .bar > i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--lamp-l) 0 6px, transparent 6px 8px); }
    #minimap { position: fixed; right: max(8px, env(safe-area-inset-right));
               bottom: max(8px, env(safe-area-inset-bottom)); z-index: var(--z-minimap);
               border: 0; background: var(--lamp-h); box-shadow: 0 0 0 2px var(--sh), 0 0 0 4px var(--s1);
               width: 150px; height: auto; cursor: crosshair; }
    /* a sub-heading inside the overlay menu is a label, not a second panel header */
    #ovl > h3.sub { position: static; min-height: 0; margin: 12px 0 4px; padding: 8px 0 0; background: none;
                    box-shadow: inset 0 2px 0 0 var(--sh);
                    font: 500 11px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
    #ovl .legend { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
    /* the settings dialog: a Bulkhead panel at the centre, docked to the bottom on a phone */
    #perfdlg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: var(--z-dialog);
               width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 24px); margin: 0; }
    @container bh (max-width: 599px) {
      #perfdlg { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-height: 85vh; }
    }
</style>
</head>
<body class="bh bh-root">
  <div id="app"><canvas id="cv"></canvas><canvas id="fx"></canvas></div>
  <div id="hud" hidden></div>
  <div id="bar">
    <!-- the floor stepper: up over down, beside the floor's name (bh-level) -->
    <div class="bh-level" id="levelCtl" role="group" aria-label="level" hidden>
      <div class="bh-updown">
        <button class="bh-btn" id="levelUp" title="up a level" aria-label="up a level"><i class="bh-arrow"></i></button>
        <button class="bh-btn" id="levelDown" title="down a level" aria-label="down a level"><i class="bh-arrow bh-arrow--down"></i></button>
      </div>
      <span class="bh-level-name" id="level" aria-live="polite"></span>
    </div>
    <!-- Population stays on the row at every width: it is the panel people open most,
         and a phone's row has room for it beside the floor stepper. -->
    <button class="bh-btn bh-btn--sm" id="popBtn" title="population by role over time (p)">population</button>
    <!-- The rest, in groups: inline on a wide screen (a divider between groups), folded
         into a drop-down sheet on a phone (a label over each group). A group whose
         controls are all hidden hides itself -- see syncBarGroups in main.ts. -->
    <div id="barTools" class="bar-tools">
      <div class="bar-group bar-group--views" role="group" aria-label="views">
        <span class="bh-label bar-glabel">views</span>
        <button class="bh-btn bh-btn--sm" id="ovlBtn" title="sense overlays: smell and sound heatmaps">overlays</button>
        <button class="bh-btn bh-btn--sm" id="drone" title="go to the next steward drone and follow it" hidden>drone</button>
        <button class="bh-btn bh-btn--sm" id="tuneBtn" title="every simulation constant (debug mode)" hidden>constants</button>
      </div>
      <div class="bar-group" role="group" aria-label="simulation">
        <span class="bh-label bar-glabel">simulation</span>
        <button class="bh-btn bh-btn--sm" id="pause">pause</button>
        <select class="bh-input bh-input--sm" id="speed" title="simulation speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
      <div class="bar-group" role="group" aria-label="placing">
        <span class="bh-label bar-glabel">placing</span>
        <select class="bh-input bh-input--sm" id="spawn" title="what a tap on open ground drops">
          <option value="" selected>tap: follow</option>
          <option value="food">tap: food</option>
          <option value="crate">tap: crate</option>
          <option value="hazard">tap: hazard</option>
          <option value="genome" disabled>tap: genome</option>
        </select>
        <button class="bh-btn bh-btn--sm" id="inject" title="load a .genome file, then use 'tap: genome' to place it">⤒ load genome</button>
        <input id="injectFile" type="file" accept=".genome,.txt,text/plain" style="display:none" />
      </div>
      <div class="bar-group" role="group" aria-label="settings" id="barSettings">
        <span class="bh-label bar-glabel">settings</span>
      </div>
    </div>
    <button class="bh-btn bh-btn--sm bh-btn--icon" id="barToggle" aria-expanded="false" aria-controls="barTools"
      aria-label="tools" title="tools"><i class="bar-burger" aria-hidden="true"></i></button>
  </div>
  <div id="pop" class="panel half">
    <h3><span class="ttl">population by</span>
      <button id="popModeRoles" class="on" title="headcount by trophic role">role</button>
      <button id="popModeLin" title="one clade's species over time — is each line breeding on, or is the warden reseeding it?">lineage</button>
      <button id="popClade" hidden
        title="cycle which clade the diagram shows — a lineage never crosses clades, so one clade at a time loses nothing">herbivore</button>
      <span class="win" id="popWin"></span>
      <button type="button" class="szbtn" title="full screen">⛶</button><button type="button" class="x" title="close" aria-label="close">✕</button></h3>
    <canvas id="popCv"></canvas>
    <div id="popKey"></div>
  </div>
  <div id="ovl" class="panel menu">
    <h3>sense overlays<button type="button" class="x" title="close" aria-label="close">✕</button></h3>
    <label><input class="bh-box" type="checkbox" id="ovlSmell" />
      <span class="sw" style="background:#e628be"></span>smell — pheromone clouds</label>
    <label><input class="bh-box" type="checkbox" id="ovlSound" />
      <span class="sw" style="background:#f2b84b"></span>sound — events in earshot</label>
    <h3 class="sub">climate <span class="legend" id="climLegend"></span></h3>
    <label><input class="bh-box" type="radio" name="clim" id="climOff" value="" />none</label>
    <label><input class="bh-box" type="radio" name="clim" id="climLight" value="light" />
      <span class="sw" style="background:#1a1a2e"></span>light — dark where the sky cannot reach</label>
    <label><input class="bh-box" type="radio" name="clim" id="climTemp" value="temperature" />
      <span class="sw" style="background:linear-gradient(90deg,#3b6fd6,#e8442a)"></span>temperature — cool to warm</label>
    <label><input class="bh-box" type="radio" name="clim" id="climHumid" value="humidity" />
      <span class="sw" style="background:#2f8fd6"></span>humidity — dry to wet</label>
  </div>
  <div id="tuning" class="panel half">
    <h3>simulation constants<button type="button" class="szbtn" title="full screen">⛶</button><button
      type="button" class="x" title="close" aria-label="close">✕</button></h3>
    <div id="tuneBody"></div>
    <div class="foot" id="tuneFoot"></div>
  </div>
  <!-- the phone's level control: every floor in a column on the right edge, under the thumb.
       Built from the floor count on every hello (buildFloorRail in main.ts). -->
  <nav class="bh-rail" id="floorRail" aria-label="floors" hidden><span class="bh-rail-cap" aria-hidden="true">floor</span></nav>
  <div id="stats">connecting…</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="inspect" class="panel"></div>
  <canvas id="minimap" width="150" height="90"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
