# bluproto world server + TLS edge, for the Hetzner VPS (see deploy/README.md).
# Caddy terminates HTTPS with a Cloudflare Origin Certificate (Cloudflare
# proxies the domain in "Full (strict)" mode) and proxies HTTP+WebSocket
# traffic to the world server.
#
# Updates are hands-off: the image is built in CI and pushed to GHCR
# (.github/workflows/publish.yml); the watchtower service below watches that
# package and swaps in each new image automatically. `build:` stays only as a
# first-boot fallback before CI has published anything (see deploy/setup.sh).

services:
  server:
    image: ghcr.io/lhedinger/bluproto:latest
    build:
      context: ..
    restart: unless-stopped
    environment:
      SEED: "${SEED:-42}"
      PORT: "7070"
      COMMAND_TOKEN: "${COMMAND_TOKEN:?set in .env — gate for mutating commands}"
      RECORD_DIR: "/data" # durable session recording survives restarts
    volumes:
      - bluproto-data:/data
    labels:
      # Only containers with this label are auto-updated by watchtower.
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    environment:
      DOMAIN: "${DOMAIN:?set in .env — your Cloudflare-managed domain}"
    depends_on:
      - server

  # Auto-deploy: polls GHCR every 2 minutes and, when a newer server image is
  # published, pulls it and recreates the container (preserving env/volumes),
  # then prunes the old image so the VPS's fixed disk doesn't fill. Only the
  # label-enabled server is watched — Caddy and watchtower itself are left be.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 120

volumes:
  caddy-data:
  bluproto-data:
