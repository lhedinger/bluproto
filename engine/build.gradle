// The simulation engine. The Java renderer survives headless as the visual
// source of truth — the server bakes ground layers and sprite atlases through
// it, and the scenario suite renders captures with it — but the Swing desktop
// app is retired (MODERNIZATION.md: "survives until web parity, then
// retires"); the web client at :server is the only interactive viewer.
//
// Sources deliberately stay at the repo root (src/, res/) so the historical
// plain-javac workflow — `find src -name '*.java' > /tmp/srcs.txt && javac -d
// bin @/tmp/srcs.txt` — keeps working unchanged during the transition. The
// module is the packaging/CI seam, not a file move.

plugins {
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sourceSets {
	main {
		java {
			srcDirs = ["${rootDir}/src"]
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// The scenario suite is the project's regression backbone. It is a plain
// main() harness (no test framework, by design), so it runs as JavaExec and
// is wired into `check` — `gradle check` / CI fail when a scenario fails.
tasks.register('simTest', JavaExec) {
	group = 'verification'
	description = 'Runs the deterministic scenario suite (SimTests).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.hedinger.prototype.simtest.SimTests'
	workingDir = rootDir
	systemProperty 'java.awt.headless', 'true'
}
tasks.named('check') {
	dependsOn 'simTest'
}
