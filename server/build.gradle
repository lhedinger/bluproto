// The web backend (MODERNIZATION.md Phase 2): hosts one live world behind
// Javalin — REST for world info/control, a WebSocket streaming snapshots out
// and taking commands in, and the baked static layers + debug page as files.

plugins {
	id 'application'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':engine')
	implementation 'io.javalin:javalin:6.6.0'
	implementation 'org.slf4j:slf4j-simple:2.0.16'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// Fold the Vite/TS client's dist/ into the server jar's static files, so a
// packaged server serves the finished site with no separate step. `buildClient`
// (needs npm) regenerates dist; `copyClient` folds whatever dist exists into the
// resources. Decoupled so a Docker build can produce dist/ in a Node stage and
// have the (Node-less) Gradle stage still copy it in. With neither npm nor a
// prebuilt dist, the bundled debug page remains — a bare checkout still runs.
def clientDir = file("${rootDir}/client")
def clientDist = file("${clientDir}/dist")
def npm = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'
def haveNpm = ["bash", "-lc", "command -v ${npm}"].with {
	try { exec { commandLine it; standardOutput = new ByteArrayOutputStream() }.exitValue == 0 }
	catch (ignored) { false }
}

tasks.register('buildClient', Exec) {
	group = 'build'
	description = 'npm install + vite build of the web client'
	enabled = haveNpm
	workingDir = clientDir
	inputs.dir("${clientDir}/src")
	inputs.file("${clientDir}/index.html")
	inputs.file("${clientDir}/package.json")
	outputs.dir(clientDist)
	commandLine 'bash', '-lc', "${npm} install --no-audit --no-fund && ${npm} run build"
}

tasks.register('copyClient', Copy) {
	if (haveNpm) {
		dependsOn 'buildClient'
	}
	onlyIf { clientDist.exists() } // freshly built, prebuilt (Docker), or skip
	from(clientDist)
	into("${layout.buildDirectory.get()}/resources/main/public")
}
tasks.named('processResources') { finalizedBy 'copyClient' }
tasks.named('classes') { dependsOn 'copyClient' }

application {
	mainClass = 'net.hedinger.prototype.server.ServerMain'
}
tasks.named('run') {
	workingDir = rootDir // sprites/ground textures load from filesystem-relative res/
	systemProperty 'java.awt.headless', 'true'
}

// Plain-main test harness (same convention as the engine's SimTests).
tasks.register('serverTest', JavaExec) {
	group = 'verification'
	description = 'Runs the server-layer tests (delta encoding, protocol JSON).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.hedinger.prototype.server.ServerTests'
	workingDir = rootDir
	systemProperty 'java.awt.headless', 'true'
}
tasks.named('check') {
	dependsOn 'serverTest'
}
