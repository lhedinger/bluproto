name: Publish image

# Builds the world-server image and pushes it to GHCR on every push to master.
# The Hetzner VPS doesn't build anything: Watchtower (deploy/docker-compose.yml)
# watches this package and pulls the new image automatically — so "push to
# master" is the whole deploy. No SSH key, no build on the little box.
#
# Built for linux/amd64 only — the VPS is x86, and building arm64 under QEMU
# emulation tripled the build time for an image nothing runs. To target an arm
# (CAX) box, add linux/arm64 back to `platforms` below (and restore the QEMU
# setup step). The package is public (repo is public), so the VPS pulls it
# without credentials — one-time: after the first publish, set the package
# visibility to Public (repo → Packages → bluproto → Package settings).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx for BuildKit (layer caching); no QEMU needed for a native amd64
      # build. Re-add docker/setup-qemu-action@v3 if you restore arm64.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the commit into the image so /api/health reports it.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # GitHub Actions cache keeps the JVM/npm layers warm between pushes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
