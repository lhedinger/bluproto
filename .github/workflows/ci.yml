name: CI

on:
  push:
  pull_request:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # `check` runs the deterministic scenario suite (SimTests) — the
      # project's regression backbone — plus any module test tasks.
      - name: Build & run scenario suite
        run: ./gradlew check --no-daemon
