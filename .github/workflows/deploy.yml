name: Deploy

# Deploys to the Hetzner VPS (deploy/README.md). Runs automatically on every
# push to master, and can be triggered by hand for any branch. Requires two
# repo secrets: DEPLOY_HOST (e.g. root@1.2.3.4) and DEPLOY_SSH_KEY (a private
# key whose public half is authorized on the VPS). Until those are set the job
# skips cleanly (green), so pushes are never blocked by an unconfigured deploy.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Push latest code to the VPS and rebuild
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BRANCH: ${{ inputs.branch || 'master' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY secrets not set — skipping deploy."
            echo "Add them in repo Settings → Secrets to enable auto-deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" \
            "BRANCH=$BRANCH bash /opt/bluproto/deploy/setup.sh"
